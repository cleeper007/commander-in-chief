name: Behavioral tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

jobs:
  static:
    name: Static repository and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
      - run: mkdir -p artifacts && npm run test:static 2>&1 | tee artifacts/static.log
      - run: python3 -m py_compile tools/worldgeo.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-summary
          path: artifacts/static.log
          retention-days: 7

  unit:
    name: Fast unit, invariant, and regression tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p artifacts && npm run test:unit 2>&1 | tee artifacts/unit.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-summary
          path: artifacts/unit.log
          retention-days: 7

  save-load:
    name: Save and restore matrix
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p artifacts && npm run test:save 2>&1 | tee artifacts/save-load.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-load-summary
          path: artifacts/save-load.log
          retention-days: 7

  campaign:
    name: Fixed-seed campaign smoke tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p artifacts && npm run test:campaign 2>&1 | tee artifacts/campaign.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-summary
          path: artifacts/campaign.log
          retention-days: 7

  browser:
    name: Pull-request browser smoke test
    if: github.event_name == 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p artifacts && npm run test:browser 2>&1 | tee artifacts/browser.log
        env:
          BROWSER_BIN: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-summary
          path: artifacts/browser.log
          retention-days: 7

  balance-sweep:
    name: Larger nightly balance sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p artifacts && npm run test:balance | tee artifacts/balance-summary.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-summary
          path: artifacts/balance-summary.json
          retention-days: 14
